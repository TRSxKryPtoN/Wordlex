# Builds the Android APK on GitHub's servers, so no Android Studio is needed.
# Push this project to a GitHub repository, open the "Actions" tab, pick
# "Build Android APK", press "Run workflow", then download "wordlex-apk"
# from the finished run.
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install Capacitor
        run: npm install --no-audit --no-fund

      - name: Copy the game into the Android project
        run: npx cap sync android

      - name: Build the APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: wordlex-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
